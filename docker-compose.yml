services:
  ollama:
    image: ollama/ollama:latest
    container_name: cybergraphrag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybergraphrag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # default to ollama inside compose network
      - OPENAI_API_BASE=http://ollama:11434/v1
      - OPENAI_API_KEY=ollama
      - OPENAI_MODEL=llama3.1:8b
      - LLM_PROVIDER=openai
    volumes:
      - ./data:/app/data
      - ./evaluation:/app/evaluation
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: cybergraphrag-dashboard
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ollama_models:
